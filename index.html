<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NxtWave AI workshop: registrations and referrals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ECEFE8; --surface:#FFFFFF; --ink:#141C33; --muted:#59627A; --line:#D3D8CD;
  --accent:#FFC93C; --accent-ink:#141C33; --good:#0E7A6B; --warn:#B4480F; --focus:#2F4BD8;
  --c-champion:#2F4BD8; --c-referral:#0E9A82; --c-club:#D39500; --c-direct:#A3ABBD;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1320; --surface:#171D2E; --ink:#E8ECF4; --muted:#9BA5BD; --line:#2B3349;
    --accent:#FFCF4D; --accent-ink:#141C33; --good:#41C9B5; --warn:#F2994A; --focus:#8EA2FF;
    --c-champion:#7D93FF; --c-referral:#41C9B5; --c-club:#F2C14E; --c-direct:#69728A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#171D2E; --ink:#E8ECF4; --muted:#9BA5BD; --line:#2B3349;
  --accent:#FFCF4D; --accent-ink:#141C33; --good:#41C9B5; --warn:#F2994A; --focus:#8EA2FF;
  --c-champion:#7D93FF; --c-referral:#41C9B5; --c-club:#F2C14E; --c-direct:#69728A;
  color-scheme:dark;
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.55 var(--body); -webkit-font-smoothing:antialiased; }
h1,h2,h3{ font-family:var(--display); line-height:1.08; margin:0; letter-spacing:-0.015em; }
p{ margin:0; }
img,svg{ max-width:100%; }
a{ color:inherit; }
button{ font:inherit; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; border-radius:6px; }

.notice{ border-bottom:1px solid var(--line); font-size:13px; color:var(--muted); }
.notice-in{ max-width:1080px; margin:0 auto; padding:9px 20px; }
header.top{ max-width:1080px; margin:0 auto; padding:16px 20px 8px; display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; justify-content:space-between; }
.brand{ font-family:var(--display); font-weight:800; font-size:19px; letter-spacing:-0.01em; }
.brand span{ display:block; font-family:var(--body); font-weight:400; font-size:13px; color:var(--muted); letter-spacing:0; }
nav.tabs{ display:flex; gap:2px; padding:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; overflow-x:auto; max-width:100%; }
nav.tabs button{ border:0; background:transparent; color:var(--ink); padding:8px 14px; border-radius:999px; font-weight:500; font-size:15px; cursor:pointer; white-space:nowrap; }
nav.tabs button[aria-current="page"]{ background:var(--ink); color:var(--bg); }

.wrap{ max-width:1080px; margin:0 auto; padding:20px 20px 64px; }
.narrow{ max-width:560px; }
.muted{ color:var(--muted); }
.small{ font-size:14px; }
.lede{ font-size:18px; color:var(--muted); max-width:46ch; margin-top:14px; }
.page-title{ font-size:clamp(32px,6vw,44px); font-weight:800; }

/* register */
.reg-grid{ display:grid; gap:36px; }
@media (min-width:900px){ .reg-grid{ grid-template-columns:1.05fr 1fr; align-items:start; } .hero{ padding-top:28px; } }
.hero h1{ font-size:clamp(40px,7.4vw,66px); font-weight:800; letter-spacing:-0.03em; max-width:11ch; }
.facts{ display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 0; padding:0; list-style:none; }
.facts li{ padding:6px 12px; border:1px solid var(--line); border-radius:999px; font-size:14px; background:var(--surface); }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:24px; }
.panel-title{ font-size:26px; font-weight:800; margin-bottom:16px; }
.field{ display:grid; gap:6px; margin-bottom:14px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
label{ font-weight:500; font-size:14px; }
.opt{ font-weight:400; color:var(--muted); }
input,select{ font:inherit; font-size:16px; width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
input[aria-invalid="true"],select[aria-invalid="true"]{ border-color:var(--warn); }
.err{ color:var(--warn); font-size:13px; }
.err:empty{ display:none; }
.hint{ border-left:3px solid var(--accent); padding:8px 12px; font-size:14px; margin-bottom:16px; background:var(--bg); border-radius:0 8px 8px 0; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; font:600 15px/1 var(--body); padding:13px 18px; border-radius:12px; border:1px solid transparent; cursor:pointer; text-decoration:none; }
.btn-primary{ background:var(--ink); color:var(--bg); }
.btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
.btn-block{ width:100%; margin-top:6px; }
.linkbtn{ background:none; border:0; padding:6px 0; color:var(--muted); text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-size:14px; }
.actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
details.msg{ margin-top:12px; font-size:14px; }
details.msg summary{ cursor:pointer; color:var(--muted); }
details.msg p{ margin-top:8px; padding:12px; background:var(--bg); border-radius:10px; user-select:text; }
.demo{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; margin-top:20px; padding-top:18px; border-top:1px solid var(--line); }
.demo p{ flex:1 1 200px; }

/* the pass */
.pass{ position:relative; background:var(--accent); color:var(--accent-ink); border-radius:18px; padding:22px 24px 20px; max-width:440px; }
.pass.new{ animation:passIn .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes passIn{ from{ opacity:0; transform:translateY(14px) rotate(-1.5deg); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){ .pass.new{ animation:none; } }
.pass-label{ font-size:13px; font-weight:600; opacity:.72; }
.pass-name{ font-family:var(--display); font-size:30px; font-weight:800; line-height:1.1; margin-top:4px; overflow-wrap:anywhere; }
.pass-title{ font-size:15px; margin-top:6px; }
.pass-meta{ font-size:13px; opacity:.72; margin-top:2px; }
.perf{ position:relative; border-top:2px dashed rgba(20,28,51,.35); margin:18px -6px; }
.perf::before,.perf::after{ content:""; position:absolute; top:-13px; width:24px; height:24px; border-radius:50%; background:var(--surface); }
.pass-wrap .perf::before,.pass-wrap .perf::after{ background:var(--bg); }
.perf::before{ left:-30px; } .perf::after{ right:-30px; }
.pass-code{ font-family:var(--display); font-size:44px; font-weight:800; letter-spacing:.03em; line-height:1.05; margin-top:2px; }
.slots{ display:flex; gap:10px; margin-top:16px; }
.slot{ width:44px; height:44px; border-radius:50%; border:2px dashed rgba(20,28,51,.45); display:grid; place-items:center; font-weight:600; font-size:15px; }
.slot.on{ border:2px solid var(--accent-ink); background:var(--accent-ink); color:var(--accent); }
.slot-note{ font-size:14px; margin-top:10px; }
.pass-wrap{ margin-top:24px; }

/* champions / organizer */
.toolbar{ display:flex; flex-wrap:wrap; gap:16px 28px; align-items:flex-end; justify-content:space-between; margin-bottom:24px; }
.dayctl{ display:grid; gap:6px; }
.dayctl > span{ font-size:14px; font-weight:500; }
.days{ display:flex; gap:6px; flex-wrap:wrap; }
.days button{ min-width:42px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:15px; cursor:pointer; }
.days button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.dayhelp{ font-size:13px; color:var(--muted); max-width:44ch; }
.big{ font-size:clamp(44px,8vw,72px); font-weight:800; letter-spacing:-0.03em; }
.progress{ position:relative; height:16px; background:var(--surface); border:1px solid var(--line); border-radius:999px; margin:22px 0 44px; }
.progress .fill{ height:100%; background:var(--ink); border-radius:999px; }
.progress .mark{ position:absolute; top:-7px; bottom:-7px; width:2px; background:var(--warn); }
.progress .mark span,.progress .goal{ position:absolute; top:30px; font-size:13px; color:var(--muted); white-space:nowrap; }
.progress .mark span{ left:50%; transform:translateX(-50%); }
.progress .goal{ right:0; }
.status{ display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border:1px solid var(--line); background:var(--surface); border-radius:12px; max-width:760px; }
.dot{ flex:none; width:10px; height:10px; border-radius:50%; margin-top:8px; background:var(--muted); }
.dot.warn{ background:var(--warn); } .dot.good{ background:var(--good); }
.grid2{ display:grid; gap:36px; margin-top:40px; }
@media (min-width:880px){ .grid2{ grid-template-columns:1.35fr 1fr; } }
section h3{ font-size:21px; font-weight:600; margin-bottom:14px; }
.legend{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--muted); margin-bottom:8px; }
.sw{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:7px; vertical-align:baseline; }
.sw-champion{ background:var(--c-champion); } .sw-referral{ background:var(--c-referral); } .sw-club{ background:var(--c-club); } .sw-direct{ background:var(--c-direct); }
.chart{ overflow-x:auto; }
.chart svg{ display:block; width:100%; min-width:460px; height:auto; }
.chart text{ font-family:var(--body); font-size:12px; fill:var(--muted); }
.chart .gl{ stroke:var(--line); }
.chart .tot{ fill:var(--ink); font-weight:600; }
.chart .chk{ stroke:var(--warn); stroke-dasharray:4 4; }
.chart .chklbl{ fill:var(--warn); }
.s-champion{ fill:var(--c-champion); } .s-referral{ fill:var(--c-referral); } .s-club{ fill:var(--c-club); } .s-direct{ fill:var(--c-direct); }
.table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:15px; font-variant-numeric:tabular-nums; }
th{ text-align:left; font-weight:600; font-size:13px; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
td{ padding:10px; border-bottom:1px solid var(--line); vertical-align:top; }
th.num,td.num{ text-align:right; }
td.strong{ font-weight:600; }
tr.mine td{ background:var(--surface); }
.tag{ display:inline-block; margin-left:8px; padding:1px 8px; border-radius:999px; border:1px solid var(--line); font-size:12px; color:var(--muted); white-space:nowrap; }
dl.stats{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:0; }
dl.stats dt{ font-size:14px; color:var(--muted); }
dl.stats dd{ margin:4px 0 0; font-family:var(--display); font-size:32px; font-weight:800; }
ol.colleges{ list-style:none; margin:0; padding:0; display:grid; gap:12px; }
ol.colleges li{ display:grid; grid-template-columns:1fr auto; gap:4px 12px; font-size:15px; }
ol.colleges .bar{ grid-column:1 / -1; height:6px; border-radius:6px; background:var(--line); overflow:hidden; }
ol.colleges .bar i{ display:block; height:100%; background:var(--ink); }
.champ-code{ font-family:var(--display); font-size:40px; font-weight:800; letter-spacing:.03em; }
.champ-done{ display:grid; gap:10px; }
footer.foot{ margin-top:48px; padding-top:18px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; font-size:14px; color:var(--muted); }

.toast{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; padding:0 16px calc(20px + env(safe-area-inset-bottom,0px)); pointer-events:none; }
.toast span{ background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transform:translateY(8px); transition:opacity .2s, transform .2s; }
.toast span.show{ opacity:1; transform:none; }
@media (max-width:480px){ .row2{ grid-template-columns:1fr; } dl.stats dd{ font-size:26px; } }
</style>
</head>
<body>
<div class="notice"><div class="notice-in">Prototype for the NxtWave Growth Challenge. Campaign numbers are simulated, and anything you enter is saved only in this browser.</div></div>
<header class="top">
  <div class="brand">NxtWave AI workshop<span>Registrations and referrals</span></div>
  <nav class="tabs" aria-label="Sections">
    <button type="button" data-view="register">Register</button>
    <button type="button" data-view="pass">My pass</button>
    <button type="button" data-view="champions">Champions</button>
    <button type="button" data-view="organizer">Organizer</button>
  </nav>
</header>
<main id="view" class="wrap"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const SHARE_BASE = 'https://claude.ai/artifact/NAajzchpQj5pf1GpfqvQMW';
const GOAL = 500, CHECK = 250, CHECK_DAY = 4, DAYS = [1,2,3,4,5,6,7];
const KEY = 'nxtwave-referral-tracker-v1';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- simulated campaign (deterministic) ---------- */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(20261005);
const pickR = arr => arr[Math.floor(rng() * arr.length)];
function weightedR(items, weights){ const s = weights.reduce((a, b) => a + b, 0); let r = rng() * s; for (let i = 0; i < items.length; i++){ r -= weights[i]; if (r <= 0) return items[i]; } return items[items.length - 1]; }
const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const usedCodes = new Set();
function makeCode(prefix, rand){ let c; do { c = prefix; for (let i = 0; i < 4; i++) c += ALPH[Math.floor(rand() * ALPH.length)]; } while (usedCodes.has(c)); usedCodes.add(c); return c; }

const FIRST = ['Aarav','Aditi','Akash','Ananya','Arjun','Bhavana','Deepak','Divya','Gokul','Harini','Ishaan','Janani','Karthik','Keerthana','Lakshmi','Manoj','Meera','Naveen','Nikhil','Pooja','Pranav','Priya','Rahul','Ramya','Rohit','Sanjana','Sneha','Srinivas','Swathi','Tarun','Varun','Vidya','Vignesh','Yamini','Zoya','Faizan','Ayesha','Harsh','Kavya','Siddharth'];
const INITIALS = 'ABCDGKMNPRSTV'.split('');
const CITIES = ['Salem','Madurai','Tiruchirappalli','Vellore','Erode','Tirunelveli','Guntur','Nellore','Warangal','Karimnagar','Mysuru','Hubballi','Belagavi','Kakinada','Nagpur','Nashik','Indore','Bhopal','Kota','Lucknow','Patna','Ranchi','Bhubaneswar','Guwahati','Kochi','Thrissur','Coimbatore','Visakhapatnam','Aurangabad','Jaipur'];
const COLLEGES = CITIES.map(c => `Engineering college, ${c}`);
const BRANCHES = ['CSE','ECE','EEE','Mechanical','IT','Civil'];
const BRANCH_W = [38,20,13,14,10,5];
const YEARS = ['Final year','Third year','Other'];
const YEAR_W = [88,9,3];
const personR = () => `${pickR(FIRST)} ${pickR(INITIALS)}.`;
const phoneR = () => '9' + Array.from({length: 9}, () => Math.floor(rng() * 10)).join('');

const SEED_CHAMPS = [];
for (let i = 0; i < 30; i++){
  const fb = i >= 20;
  SEED_CHAMPS.push({ code: makeCode('CH-', rng), name: personR(), college: COLLEGES[i], startDay: fb ? 5 : 1, w: fb ? 0.9 + rng() * 0.6 : 0.3 + rng() * 1.4, quietFrom: [3,11,16].includes(i) ? 3 : 0, fallback: fb, seeded: true });
}
const CLUBS = [['Coding club',1],['IEEE student branch',3],['AI and ML club',14],['Robotics club',24],['Developer club',16]].map(([name, ci]) => ({ code: makeCode('CL-', rng), name, college: COLLEGES[ci] }));

const DAILY = [12,70,80,68,112,104,86];
const MIX = [[.75,.05,.10,.10],[.70,.10,.15,.05],[.62,.18,.15,.05],[.55,.26,.14,.05],[.52,.32,.12,.04],[.50,.34,.12,.04],[.48,.36,.12,.04]];
const SOURCES = ['champion','referral','club','direct'];
const SRC_LABEL = { champion:'Champion link', referral:'Friend referral', club:'Club post', direct:'Direct' };
const SEED_REGS = [], SEED_DUPES = {};
DAYS.forEach(d => {
  for (let i = 0; i < DAILY[d - 1]; i++){
    let src = weightedR(SOURCES, MIX[d - 1]);
    if (src === 'referral' && SEED_REGS.length === 0) src = 'champion';
    let ref = '', college = pickR(COLLEGES);
    if (src === 'champion'){
      const active = SEED_CHAMPS.filter(c => c.startDay <= d);
      const ch = weightedR(active, active.map(c => (c.quietFrom && d >= c.quietFrom) ? 0.1 : c.w));
      ref = ch.code; if (rng() < 0.8) college = ch.college;
    } else if (src === 'referral'){
      const r = SEED_REGS[Math.floor(rng() * SEED_REGS.length)];
      ref = r.code; if (rng() < 0.7) college = r.college;
    } else if (src === 'club'){
      const cl = pickR(CLUBS); ref = cl.code; if (rng() < 0.6) college = cl.college;
    }
    SEED_REGS.push({ code: makeCode('R-', rng), name: personR(), phone: phoneR(), email: '', college, branch: weightedR(BRANCHES, BRANCH_W), year: weightedR(YEARS, YEAR_W), ref, day: d, t: d * 10000 + i, seeded: true });
  }
  SEED_DUPES[d] = Math.round(DAILY[d - 1] * 0.03 + rng() * 2);
});

/* ---------- this browser's entries ---------- */
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw){ const s = JSON.parse(raw); return { regs: Array.isArray(s.regs) ? s.regs : [], champs: Array.isArray(s.champs) ? s.champs : [], dupes: s.dupes || {}, simDay: DAYS.includes(s.simDay) ? s.simDay : 4 }; } } catch (e) {}
  return { regs: [], champs: [], dupes: {}, simDay: 4 };
}
const local = load();
local.regs.forEach(r => usedCodes.add(r.code));
local.champs.forEach(c => usedCodes.add(c.code));
function save(){ try { localStorage.setItem(KEY, JSON.stringify(local)); } catch (e) {} }

const allRegs = () => SEED_REGS.concat(local.regs);
const allChamps = () => SEED_CHAMPS.concat(local.champs);
const asOf = regs => regs.filter(r => r.day <= local.simDay);
const regByCode = c => allRegs().find(r => r.code === c);
const champByCode = c => allChamps().find(x => x.code === c);
function srcOf(ref){ if (!ref) return 'direct'; if (ref.startsWith('CH-')) return 'champion'; if (ref.startsWith('CL-')) return 'club'; return 'referral'; }
function ownerOf(code){
  if (!code) return null;
  const r = regByCode(code); if (r) return { name: r.name, kind: 'reg' };
  const c = champByCode(code); if (c) return { name: c.name, kind: 'champion' };
  const cl = CLUBS.find(x => x.code === code); if (cl) return { name: `${cl.name}, ${cl.college.replace('Engineering college, ', '')}`, kind: 'club' };
  return null;
}
function rootMap(regs){
  const by = new Map(regs.map(r => [r.code, r])), memo = new Map();
  const root = (r, depth) => {
    if (memo.has(r.code)) return memo.get(r.code);
    let v = null;
    if (r.ref && (r.ref.startsWith('CH-') || r.ref.startsWith('CL-'))) v = r.ref;
    else if (r.ref){ const p = by.get(r.ref); v = p && depth < 60 ? root(p, depth + 1) : null; }
    memo.set(r.code, v); return v;
  };
  regs.forEach(r => root(r, 0));
  return memo;
}
const initials = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const pctOf = (a, b) => b ? Math.round(a / b * 100) + '%' : '0%';
const maskPhone = p => p ? p.slice(0, 2) + '••••••' + p.slice(-2) : '';

/* ---------- messages ---------- */
const linkFor = code => SHARE_BASE ? `${SHARE_BASE}?ref=${code}` : '';
function inviteMsg(reg){
  const link = linkFor(reg.code);
  return `I just signed up for a free 60-minute workshop by NxtWave: Build Your First AI Project. You build a working AI project live, right before placements.\n\n` + (link ? `Register here: ${link}\n` : '') + `Use my code ${reg.code} when you sign up.`;
}
function champMsg(c){
  const link = linkFor(c.code);
  return `Hi everyone, placements will ask about our projects. NxtWave is running a free 60-minute online workshop where you build a working AI project live. No AI experience needed.\n\n` + (link ? `Register: ${link}\n` : '') + `Code: ${c.code}`;
}

/* ---------- ui state ---------- */
const ui = { view: 'register', passCode: null, newPass: false, prefillRef: '', friendOf: '', afterFriend: '', champResult: null, lookupCode: null, lookupPhone: '', lookupErr: '' };

function readRef(){
  try {
    const q = new URLSearchParams(location.search).get('ref'); if (q) return q.trim().toUpperCase();
    const h = (location.hash || '').match(/ref=([A-Za-z0-9-]+)/); if (h) return h[1].toUpperCase();
  } catch (e) {}
  return '';
}
const r0 = readRef();

function chartSVG(regs){
  const W = 640, H = 250, L = 36, R = 10, T = 26, B = 30;
  const counts = DAYS.map(d => { const c = { champion:0, referral:0, club:0, direct:0 }; regs.forEach(r => { if (r.day === d) c[srcOf(r.ref)]++; }); return c; });
  const totals = counts.map(c => c.champion + c.referral + c.club + c.direct);
  const top = Math.max(40, Math.ceil(Math.max(...totals) / 40) * 40);
  const pw = W - L - R, ph = H - T - B, slot = pw / 7, bw = slot * 0.56;
  const y = v => T + ph - (v / top) * ph;
  let s = '';
  for (let v = 0; v <= top; v += 40) s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  DAYS.forEach((d, i) => {
    const x = L + slot * i + (slot - bw) / 2;
    let acc = 0, g = '';
    SOURCES.forEach(src => { const v = counts[i][src]; if (v > 0){ g += `<rect class="s-${src}" x="${x}" y="${y(acc + v)}" width="${bw}" height="${y(acc) - y(acc + v)}"/>`; acc += v; } });
    const tip = `Day ${d}: ${totals[i]} sign-ups (` + SOURCES.map(src => `${SRC_LABEL[src]} ${counts[i][src]}`).join(', ') + ')';
    s += `<g><title>${esc(tip)}</title>${g}${totals[i] ? `<text class="tot" x="${x + bw / 2}" y="${y(totals[i]) - 6}" text-anchor="middle">${totals[i]}</text>` : ''}</g>`;
    s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle"${d > local.simDay ? ' opacity="0.5"' : ''}>Day ${d}</text>`;
  });
  const cx = L + slot * 4;
  s += `<line class="chk" x1="${cx}" x2="${cx}" y1="${T - 14}" y2="${T + ph}"/><text class="chklbl" x="${cx + 6}" y="${T - 4}">Day-4 check</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sign-ups per day by source">${s}</svg>`;
}
function viewOrganizer(){
  const d = local.simDay, all = allRegs(), regs = asOf(all), n = regs.length;
  const d4 = all.filter(r => r.day <= CHECK_DAY).length;
  let dot = 'neutral', status;
  if (d < CHECK_DAY) status = `Checkpoint: ${CHECK} sign-ups needed by the end of Day 4. ${n} so far, ${Math.max(0, CHECK - n)} to go.`;
  else if (d4 < CHECK){ dot = 'warn'; status = `Day 4 ended at ${d4}, below the ${CHECK} checkpoint, so the fallback is on from Day 5: 10 more champions recruited and friend referrals earn double points.` + (d > CHECK_DAY ? ` ${n - d4} sign-ups have come in since.` : ''); }
  else { dot = 'good'; status = `Day 4 ended at ${d4}, above the ${CHECK} checkpoint. No fallback needed.`; }
  const counts = { champion:0, referral:0, club:0, direct:0 }; regs.forEach(r => counts[srcOf(r.ref)]++);
  const PLAN = { champion: 300, referral: 125, club: 75 };
  const srcRows = SOURCES.map(s => `<tr><td><span class="sw sw-${s}"></span>${SRC_LABEL[s]}</td><td class="num">${counts[s]}</td><td class="num">${PLAN[s] != null ? PLAN[s] : 'Not planned'}</td><td class="num">${pctOf(counts[s], n)}</td></tr>`).join('');
  const refCount = new Map(); regs.forEach(r => { if (r.ref && r.ref.startsWith('R-')) refCount.set(r.ref, (refCount.get(r.ref) || 0) + 1); });
  const sharers = regs.filter(r => refCount.get(r.code) > 0).length;
  const kits = regs.filter(r => (refCount.get(r.code) || 0) >= 3).length;
  let dupes = 0; DAYS.forEach(x => { if (x <= d) dupes += (SEED_DUPES[x] || 0) + (local.dupes[x] || 0); });
  const finalYear = regs.filter(r => r.year === 'Final year').length;
  const byCollege = new Map(); regs.forEach(r => byCollege.set(r.college, (byCollege.get(r.college) || 0) + 1));
  const topC = [...byCollege.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maxC = topC.length ? topC[0][1] : 1;
  const latest = regs.slice().sort((a, b) => b.day - a.day || b.t - a.t).slice(0, 8);
  const latestRows = latest.map(r => `<tr${r.seeded ? '' : ' class="mine"'}><td>${esc(r.name)}${r.seeded ? '' : '<span class="tag">Added by you</span>'}</td><td>${esc(r.college)}</td><td>${esc(r.branch)}</td><td>${SRC_LABEL[srcOf(r.ref)]}${r.ref ? ` <span class="muted">${esc(r.ref)}</span>` : ''}</td><td class="num">${r.day}</td></tr>`).join('');
  const pct = Math.min(n / GOAL, 1) * 100;
  return `<div class="toolbar">
      <div><h2 class="big">${n} registered</h2><p class="muted">of the ${GOAL} goal by the end of Day ${d}. ${n >= GOAL ? 'Goal reached.' : `${GOAL - n} to go.`}</p></div>
      ${daySel()}
    </div>
    <div class="progress" role="img" aria-label="${n} of ${GOAL} registered">
      <div class="fill" style="width:${pct}%"></div>
      <div class="mark" style="left:${CHECK / GOAL * 100}%"><span>Day-4 check: ${CHECK}</span></div>
      <span class="goal">Goal: ${GOAL}</span>
    </div>
    <div class="status"><span class="dot ${dot}"></span><p>${status}</p></div>
    <div class="grid2">
      <section><h3>Sign-ups per day</h3>
        <div class="legend">${SOURCES.map(s => `<span><span class="sw sw-${s}"></span>${SRC_LABEL[s]}</span>`).join('')}</div>
        <div class="chart">${chartSVG(regs)}</div>
      </section>
      <section><h3>Where sign-ups come from</h3>
        <div class="table-wrap"><table><thead><tr><th>Source</th><th class="num">So far</th><th class="num">Plan by Day 7</th><th class="num">Share</th></tr></thead><tbody>${srcRows}</tbody></table></div>
      </section>
    </div>
    <div class="grid2">
      <section><h3>Top colleges</h3>
        <ol class="colleges">${topC.map(([c, v]) => `<li><span>${esc(c)}</span><span class="strong">${v}</span><span class="bar"><i style="width:${v / maxC * 100}%"></i></span></li>`).join('') || '<li class="muted">No sign-ups yet.</li>'}</ol>
      </section>
      <section><h3>Quality</h3>
        <dl class="stats">
          <div><dt>Final-year share</dt><dd>${pctOf(finalYear, n)}</dd></div>
          <div><dt>Duplicate sign-ups blocked</dt><dd>${dupes}</dd></div>
          <div><dt>Registrants who brought a friend</dt><dd>${pctOf(sharers, n)}</dd></div>
          <div><dt>Starter kits unlocked</dt><dd>${kits}</dd></div>
        </dl>
      </section>
    </div>
    <section style="margin-top:40px"><h3>Latest sign-ups</h3>
      <div class="table-wrap"><table><thead><tr><th>Name</th><th>College</th><th>Branch</th><th>Source</th><th class="num">Day</th></tr></thead><tbody>${latestRows}</tbody></table></div>
    </section>
    <footer class="foot"><span>College and student names are made up for this simulation.</span><button class="linkbtn" type="button" data-act="reset">Clear my test entries</button></footer>`;
}

/* ---------- render + events ---------- */
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.view === ui.view ? 'page' : 'false'));
  const v = $('#view');
  v.innerHTML = ui.view === 'register' ? viewRegister() : ui.view === 'pass' ? viewPass() : ui.view === 'champions' ? viewChampions() : viewOrganizer();
}
function focusSoon(sel){ setTimeout(() => { const el = $(sel); if (el) el.focus(); }, 0); }
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>`;
  const s = t.firstChild; requestAnimationFrame(() => s.classList.add('show'));
  clearTimeout(toastTimer); toastTimer = setTimeout(() => s.classList.remove('show'), 2200);
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast('Invite message copied'); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'absolute'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove();
  toast(ok ? 'Invite message copied' : 'Copying is blocked here. Open "See the message" and copy it from there.');
}
function normPhone(v){ let p = String(v || '').replace(/\D/g, ''); if (p.length === 12 && p.startsWith('91')) p = p.slice(2); if (p.length === 11 && p.startsWith('0')) p = p.slice(1); return p; }
const validPhone = p => /^[6-9]\d{9}$/.test(p);
function showErrors(map, prefix, idPrefix){
  let first = null;
  Object.keys(map).forEach(k => {
    const e = $('#' + prefix + k), input = $('#' + idPrefix + k);
    if (e) e.textContent = map[k] || '';
    if (input) input.setAttribute('aria-invalid', map[k] ? 'true' : 'false');
    if (map[k] && !first) first = input;
  });
  if (first) first.focus();
  return !!first;
}
function submitReg(){
  const g = id => $('#f-' + id).value;
  const v = { name: g('name').trim(), phone: normPhone(g('phone')), email: g('email').trim(), college: g('college').trim(), branch: g('branch'), year: g('year'), ref: g('ref').trim().toUpperCase() };
  const errs = { name:'', phone:'', email:'', college:'', branch:'', year:'', ref:'' };
  if (v.name.length < 2) errs.name = 'Enter your full name.';
  if (!validPhone(v.phone)) errs.phone = 'Enter a 10-digit Indian mobile number.';
  else if (allRegs().some(r => r.phone === v.phone)){ errs.phone = 'This number is already registered. Open My pass to see your code.'; local.dupes[local.simDay] = (local.dupes[local.simDay] || 0) + 1; save(); }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) errs.email = 'Enter a valid email address.';
  if (!v.college) errs.college = 'Enter your college name.';
  if (!v.branch) errs.branch = 'Choose your branch.';
  if (!v.year) errs.year = 'Choose your year.';
  if (v.ref && !ownerOf(v.ref)) errs.ref = `No one has the code ${v.ref}. Check it, or clear the field.`;
  if (showErrors(errs, 'e-', 'f-')) return;
  const reg = Object.assign({}, v, { code: makeCode('R-', Math.random), day: local.simDay, t: Date.now(), seeded: false });
  local.regs.push(reg); save();
  ui.afterFriend = '';
  if (v.ref){
    const o = ownerOf(v.ref);
    if (o && o.kind === 'reg'){ const k = allRegs().filter(r => r.ref === v.ref).length; ui.afterFriend = k >= 3 ? `${o.name} now has ${k} friends and has unlocked the starter kit.` : `${o.name} now has ${k} of 3 friends.`; }
    else if (o && o.kind === 'champion') ui.afterFriend = `${o.name}'s champion score just went up by one.`;
    else if (o) ui.afterFriend = `Counted toward ${o.name}.`;
  }
  ui.passCode = reg.code; ui.newPass = true; ui.prefillRef = ''; ui.friendOf = '';
  render(); window.scrollTo({ top: 0 });
}

  else if (local.champs.some(c => c.phone === v.phone)) errs.phone = 'This number already has a champion code.';
  if (!v.college) errs.college = 'Enter your college name.';

document.addEventListener('click', e => {
  const t = e.target.closest('button[data-view], button[data-day], [data-act]');
  if (!t) return;
  if (t.dataset.view){ ui.view = t.dataset.view; ui.lookupErr = ''; render(); window.scrollTo({ top: 0 }); return; }

  switch (t.dataset.act){
    case 'copy': copyText(t.getAttribute('data-msg')); break;
    case 'friend': {

      ui.prefillRef = code; ui.friendOf = o ? o.name : ''; ui.passCode = null; ui.afterFriend = ''; ui.view = 'register';
      render(); window.scrollTo({ top: 0 }); focusSoon('#f-name'); break;
    }
    case 'another': ui.passCode = null; ui.prefillRef = ''; ui.friendOf = ''; ui.afterFriend = ''; render(); focusSoon('#f-name'); break;
    case 'newchamp': ui.champResult = null; render(); focusSoon('#c-name'); break;
    case 'reset':
      local.regs = []; local.champs = []; local.dupes = {}; save();
      ui.passCode = null; ui.champResult = null; ui.lookupCode = null; ui.afterFriend = '';
      render(); toast('Cleared your test entries'); break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'regForm') submitReg();
  else if (e.target.id === 'lookupForm') submitLookup();
  else if (e.target.id === 'champForm') submitChamp();
});
render();
})();
</script>
</body>
</html>
